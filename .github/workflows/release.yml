name: Release

# Trigger: push a tag matching v0.x.y
on:
  push:
    tags:
      - "v*.*.*"

# Note on distribution:
#   GitHub Packages does not host a pip-installable registry, so wheels are
#   attached directly to the GitHub Release and installed by URL with pip.
#   cibuildwheel (https://cibuildwheel.pypa.io) builds one wheel per platform
#   and Python version, and runs the test suite against each installed wheel.

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check that the tag matches the package and the native library
        shell: bash
        run: |
          PACKAGE=$(grep -m1 -oE '^version = "[^"]+"' pyproject.toml | cut -d'"' -f2)
          NATIVE=$(grep -m1 -oE '^version = "[^"]+"' native/Cargo.toml | cut -d'"' -f2)
          if [ "v$PACKAGE" != "$GITHUB_REF_NAME" ] || [ "$PACKAGE" != "$NATIVE" ]; then
            echo "::error::tag $GITHUB_REF_NAME, pyproject.toml $PACKAGE and native/Cargo.toml $NATIVE do not agree"
            exit 1
          fi

      - name: Set up Rust (needed inside cibuildwheel containers)
        uses: dtolnay/rust-toolchain@stable

      - name: Build native library (pre-build for the host before cibuildwheel)
        run: cargo build --release --manifest-path native/Cargo.toml

      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@v2.21.3
        env:
          # Build for CPython 3.9 through 3.13.
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-*"
          # Skip 32-bit builds and PyPy.
          CIBW_SKIP: "*-win32 *-manylinux_i686 *-musllinux* pp*"
          # The Linux wheels build inside manylinux containers that ship no Rust
          # toolchain — install one before anything else and put cargo on PATH.
          CIBW_BEFORE_ALL_LINUX: "curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal --default-toolchain stable"
          CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH"'
          # Before each wheel build inside the container, rebuild the native lib.
          CIBW_BEFORE_BUILD: "cargo build --release --manifest-path {project}/native/Cargo.toml"
          # Copy the built .so/.dll/.dylib into the fon/ package directory so
          # the wheel contains it bundled alongside __init__.py.
          CIBW_BEFORE_BUILD_LINUX: >
            cargo build --release --manifest-path {project}/native/Cargo.toml &&
            cp {project}/native/target/release/libfon_native.so {project}/fon/
          CIBW_BEFORE_BUILD_MACOS: >
            cargo build --release --manifest-path {project}/native/Cargo.toml &&
            cp {project}/native/target/release/libfon_native.dylib {project}/fon/
          CIBW_BEFORE_BUILD_WINDOWS: >
            cargo build --release --manifest-path {project}/native/Cargo.toml &&
            copy {project}\native\target\release\fon_native.dll {project}\fon\
          # Run the suite against every installed wheel, so a wheel whose bundled
          # library is missing or does not load never reaches the release.
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: "pytest {project}/tests"

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  create-release:
    name: Create GitHub Release
    needs: build-wheels
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: wheels
          merge-multiple: true

      - name: Create GitHub Release and attach wheels
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            wheels/*.whl
